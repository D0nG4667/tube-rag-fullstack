[project]
name = "tuberag-backend"
version = "0.1.0"
description = "FastAPI backend for TubeRAG platforms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "supabase>=2.3.0",
    "qstash>=3.0.0",
    "google-genai>=0.1.0",
    "youtube-transcript-api>=0.6.0",
    "psycopg2-binary>=2.9.0",
    "opencv-python-headless>=4.8.0.0",
    "numpy>=1.20.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "RUF"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
